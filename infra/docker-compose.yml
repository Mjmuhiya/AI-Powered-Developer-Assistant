services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codepilot
      POSTGRES_USER: codepilot
      POSTGRES_PASSWORD: codepilot
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepilot -d codepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../services/api
    environment:
      DATABASE_URL: postgresql+psycopg://codepilot:codepilot@db:5432/codepilot
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
